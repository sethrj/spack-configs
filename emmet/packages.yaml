packages:
  cuda:
    buildable: false
    externals:
    - spec: cuda@11.6
      prefix: /usr/local/cuda-11.6
  mcnp:
    buildable: false
    externals:
    - spec: mcnp@5.1.60
      prefix: /data/mcnp/MCNP_CODE
  mcnp-data:
    buildable: false
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /data/mcnp/MCNP_DATA
  scale-data:
    buildable: false
    externals:
    - spec: scale-data@experimental
      prefix: /data/scale/data
  pcre:
    variants: +jit
  swig:
    version: [4.0.2-fortran]
  all:
    variants: +cuda cuda_arch=35
    providers:
      mpi: [openmpi]
