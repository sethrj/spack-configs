spack:
  specs:
  - cli11
  - covfie
  - cmake
  - dd4hep
  - 'doxygen@:1.14'
  - 'g4vg@1.0.4:'
  - geant4@11.3
  - git
  - git-lfs
  - 'googletest@1.10:'
  - hepmc3
  - ninja
  - nlohmann-json
  - mpi
  - 'python@3.8:'
  - py-breathe
  - py-furo
  - py-sphinx
  - py-sphinxcontrib-bibtex
  - 'root@6.30:'
  - vecgeom@1.2.10:1 +gdml
  - boost
  - py-gcovr
  - py-sphinxcontrib-mermaid
  view: true
  concretizer:
    unify: true
  packages:
    adios2:
      variants: ~blosc ~fortran ~png ~python ~ssc ~sst ~sz ~zfp
    dd4hep:
      variants: ~utilityapps ~ddeve
    mgard:
      variants: ~openmp
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb +root7
    all:
      require: cxxstd=20 ~fortran 
