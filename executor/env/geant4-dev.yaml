spack:
  include:
    - reqs-celer.yaml

#  concretizer:
#    unify: true
  concretizer:
    # Allow multiple g4 data versions simultaneously
    unify: false
#    duplicates:
#      max_dupes:
#        g4emlow: 2
#        geant4-data: 2

  view:
    default:
     root: .spack-env/view
     projections:
       g4emlow@8: prefix
       g4emlow@9: prefix
       all: prefix

  specs:
    - cmake
    - clhep
    - curl # transient for xerces-c
    - expat
    - geant4-data@=11.5
    - g4emlow@9.0
    - git
    - googletest
    - ninja
    - xerces-c
    - zlib-ng
    # Celeritas
    - cli11
    - hepmc3~rootio
    - nlohmann-json

