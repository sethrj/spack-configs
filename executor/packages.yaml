packages:
  openssl:
    externals:
    - spec: openssl@3.6.5
      prefix: /opt/homebrew/opt/openssl@3.6
  gcc:
    externals:
    - spec: gcc@16.2.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew/opt/gcc@16
      extra_attributes:
        compilers:
          c: /opt/homebrew/opt/gcc@16/bin/gcc-16
          cxx: /opt/homebrew/opt/gcc@16/bin/g++-16
          fortran: /opt/homebrew/opt/gcc@16/bin/gfortran
    buildable: false
  apple-clang:
    externals:
    - spec: apple-clang@21.0.0
      prefix: /Library/Developer/CommandLineTools/usr
      extra_attributes:
        compilers:
          c: /Library/Developer/CommandLineTools/usr/bin/clang
          cxx: /Library/Developer/CommandLineTools/usr/bin/clang++
  git:
    externals:
    - spec: git@2.56.0~tcltk
      prefix: /opt/homebrew/opt/git
  ninja:
    externals:
    - spec: ninja@1.13.2
      prefix: /opt/homebrew/opt/ninja
  bison:
    externals:
    - spec: bison@3.8.2
      prefix: /opt/homebrew/opt/bison@3.8
  libtool:
    buildable: false
    externals:
    - spec: libtool@2.6.2
      prefix: /opt/homebrew/opt/libtool
  iwyu:
    buildable: false
    externals:
    - spec: iwyu@0.27
      prefix: /opt/homebrew/opt/iwyu
  m4:
    buildable: false
    externals:
    - spec: m4@1.4.21
      prefix: /opt/homebrew/opt/m4
  gettext:
    externals:
    - spec: gettext@1.0
      prefix: /opt/homebrew/opt/gettext
  ccache:
    buildable: false
    externals:
    - spec: ccache@4.14.1
      prefix: /opt/homebrew/opt/ccache
  typescript:
    buildable: false
    externals:
    - spec: typescript@7.0.2
      prefix: /opt/homebrew/opt/typescript
  git-lfs:
    buildable: false
    externals:
    - spec: git-lfs@3.8.0
      prefix: /opt/homebrew/opt/git-lfs
  doxygen:
    buildable: false
    externals:
    - spec: doxygen@1.18.0+graphviz~mscgen
      prefix: /opt/homebrew/opt/doxygen
  automake:
    buildable: false
    externals:
    - spec: automake@1.19
      prefix: /opt/homebrew/opt/automake
  npm:
    buildable: false
    externals:
    - spec: npm@11.20.0
      prefix: /opt/homebrew/opt/nodejs
  go:
    buildable: false
    externals:
    - spec: go@1.27.1
      prefix: /opt/homebrew/opt/google-go
  cmake:
    buildable: false
    externals:
    - spec: cmake@4.4.4
      prefix: /opt/homebrew/opt/cmake
  graphviz:
    buildable: false
    externals:
    - spec: graphviz@16.1.0
      prefix: /opt/homebrew/opt/graphviz
  perl:
    buildable: false
    externals:
    - spec: perl@5.44.0~cpanm+opcode+open+shared+threads
      prefix: /opt/homebrew/opt/perl
  autoconf:
    buildable: false
    externals:
    - spec: autoconf@2.73
      prefix: /opt/homebrew/opt/autoconf
  py-pre-commit:
    # Use external brew
    buildable: false

  ### CELERITAS PREFS ###

  all:
    providers:
      mpi: [openmpi]
    prefer:
      - "cxxstd=20"
  covfie:
    variants:
      - generator=ninja
  hdf5:
    prefer: [~cxx] # override cxxstd preference
  geant4:
    variants:
      - generator=ninja
  g4vg:
    variants:
      - generator=ninja
  vecgeom:
    variants:
      - generator=ninja
      
  ## prefs-hep-nogui.yaml ##
  boost:
    variants:
      # Requirements from Allpix^2
      - "+random"
  dd4hep:
    variants:
      # Disable GUI
      - "~utilityapps ~ddeve"
  hepmc3:
    variants:
      # Requirements from Allpix^2
      - "+rootio +python"
  llvm:
    variants:
      - "+lldb +python"
  root:
    variants:
      - generator=ninja
      # Disable GUI for a lighter build
      # We generally don't use TBB threading
      # Examples aren't needed
      # Edm4hep requires root7
      # Allpix requires geom, math
      - >-
        ~aqua ~opengl ~x ~webgui
        ~davix ~examples ~tbb
        +root7
        +geom +math
