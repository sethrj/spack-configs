packages:
  openssh:
    externals:
    - spec: openssh@6.6.1p1
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.22.2
      prefix: /usr
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran +shared
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version: [2.10.0] # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  scale:
    permissions:
      read: group
      group: scale6
  silo:
    variants: ~mpi
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    compiler:
    - gcc@11.2.0
    target: [x86_64]
    variants: cxxstd=11
  # <<< install-spack.sh
  advantg-data:
    buildable: false
    externals:
    - spec: advantg-data@3
      prefix: /projects/advantg/data
  mcnp:
    buildable: false
    externals:
    - spec: mcnp@5.1.60
      prefix: /projects/mcnp/MCNP_CODE
  mcnp-data:
    buildable: false
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /projects/mcnp/MCNP_DATA
  scale-data:
    buildable: false
    externals:
    - spec: scale-data@experimental
      prefix: /projects/scale/data/experimental
