packages:
  advantg-data:
    buildable: false
    externals:
    - spec: advantg-data@3
      prefix: /projects/advantg/data
  geant4:
    variants: ~threads
  mcnp:
    buildable: false
    externals:
    - spec: mcnp@5.1.60
      prefix: /projects/mcnp/MCNP_CODE
  mcnp-data:
    buildable: false
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /projects/mcnp/MCNP_DATA
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  scale-data:
    buildable: false
    externals:
    - spec: scale-data@experimental
      prefix: /projects/scale/data/experimental
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl +szip ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version:
    - 2.10.0 # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  silo:
    variants: ~mpi
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    variants: cxxstd=11
  # <<< install-spack.sh
