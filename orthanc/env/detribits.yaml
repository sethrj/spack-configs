# This is a Spack Environment file for Exnihilo.
spack:
  # add package specs to the `specs` list
  specs:
  - bison@3.4.2
  - 'cmake@3.16:'
  - flex@2.6.4
  - flibcpp +swig
  - hdf5 +hl api=v110 +mpi
  - lava
  - geant4
  - googletest
  - 'ninja@1.10:'
  - nlohmann-json
  - openmpi
  - pugixml
  - python +uuid
  - py-h5py
  - py-lxml
  - py-matplotlib
  - py-numpy
  - py-pandas
  - py-pint
  - py-psutil
  - py-tqdm
  - qt@5:5.99 ~framework
  - silo +mpi +fortran
  - swig@4.0.2-fortran
  - superlu@5.2.2
  - trilinos +amesos +amesos2 +anasazi +aztec +belos +ifpack +teuchos gotype=long_long
    +epetra +epetraext +kokkos +ifpack2 +intrepid +ml +sacado +shards +tpetra +stratimikos
    +hdf5 +mpi ~superlu
  view: true
  concretization: together
  packages:
    hdf5:
      variants: +szip +fortran
    qt:
      variants: ~dbus~examples~gtk~opengl~phonon+shared~sql~ssl~tools~webkit
      version: [5.9.9]
    trilinos:
      variants: ~adios2 ~alloptpkgs ~boost ~cgns ~chaco ~complex ~debug ~dtk ~exodus
        +explicit_template_instantiation ~float +fortran ~fortrilinos ~glm   ~gtest
        +hdf5 ~hypre  ~intrepid2 ~isorropia ~matio ~mesquite ~metis ~minitensor ~muelu
        ~mumps ~netcdf ~nox ~openmp ~phalanx ~piro ~pnetcdf ~python ~rol ~rythmos
        +shared ~shylu ~stk ~suite-sparse ~superlu ~superlu-dist ~teko ~tempus ~x11
        ~xsdkflags ~zlib ~zoltan ~zoltan2
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
  modules:
    default:
      lmod:
        core_compilers:
        - gcc@4.8.5
