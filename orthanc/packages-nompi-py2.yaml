packages:
  mcnp:
    paths:
      mcnp@5.1.60: /projects/mcnp/MCNP_CODE
    buildable: False
  mcnp-data:
    paths:
      mcnp-data@5.1.60: /projects/mcnp/MCNP_DATA
    buildable: False
  scale-data:
    paths:
      scale-data@dev: /projects/scale/data
    buildable: False
  geant4:
    variants: cxxstd=11 ~threads ~data
  #hdf5:
  #  variants: +hl +szip
  ninja:
    version: [kitware]
  openssl:
    version: [1.1.1b]
  pcre:
    variants: +jit
  #python:
  #  variants: +shared +uuid
  #  version: [3.7.2, 2.7.16]
  #py-matplotlib:
  #  variants: ~tk
  qt:
    variants: freetype=none ~sql ~ssl ~tools
  all:
    compiler: [gcc@5.5.0]
    #compiler: [gcc@8.2.0]
    providers:
      mpi: [openmpi]
  hdf5:
    variants: +hl +szip ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler
  silo:
    variants: ~mpi
  python:
    variants: +shared +uuid
    version: [2.7.16]
  py-h5py:
    variants: ~mpi
  py-matplotlib:
    variants: ~tk
    version: [2.2.3]
