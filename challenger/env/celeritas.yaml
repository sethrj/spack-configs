spack:
  specs:
    # Packages required for a *truly minimal* build
    - cli11
    - cmake
    - nlohmann-json
    # ... plus packages required for development
    - "geant4@11.3"
    - git
    - git-lfs
    - "googletest@1.10:"
    # - "py-pre-commit ^py-identify@2.6:"
    - "python@3.9:"
    - ccache
    # ... plus *recommended* options
    - "covfie@0.13:"
    - "g4vg@1.0.3:"
    - hepmc3
    - libpng
    - ninja
    #- "root@6.28:"
    - "vecgeom@1.2.10:1 +gdml"
    # ... plus optional dependencies
    #- "dd4hep@1.33:"
    # - mpi
    # ... plus utilities
    # - gh
    - py-gcovr
    # Documentation
    - 'doxygen@:1.14'
    - py-breathe
    - py-furo
    - py-sphinx
    - py-sphinxcontrib-bibtex
  view: true
  concretizer:
    unify: true
  packages:
    adios2:
      variants: ~blosc ~fortran ~png ~python ~ssc ~sst ~sz ~zfp
    dd4hep:
      variants: ~ddcad ~ddeve ~utilityapps +hepmc3
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb +root7
    all:
      prefer:
      - "generator=ninja build_system=cmake"
      - "build_type=Release"
      require:
      - any_of: [cxxstd=20, '@:']
      - any_of: [~openmp, '@:']
