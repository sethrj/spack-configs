spack:
  specs:
  - cmake
  - git
  - git-lfs
  - googletest
  - hdf5 +hl
  - ninja
  - nlohmann-json
  - pugixml
  - "python@3.14:"
  - py-furo
  - py-h5py
  - py-lxml
  - py-myst-parser
  - py-numpy
  - py-pint
  - py-sphinx
  #- py-sphinx-rtd-theme
  - py-sphinxcontrib-bibtex
  #- gnds
  #- 'superlu@5.3'
  # - trilinos +amesos +amesos2 +anasazi +aztec +belos +ifpack gotype=long_long +epetra +epetraext +kokkos +ifpack2 +intrepid +ml +sacado +shards +tpetra +stratimikos ~mpi
  - >-
    trilinos@14.4:16 +kokkos
    +shared
    +epetra +intrepid +ifpack +anasazi
    +ml +ifpack2 +tpetra +epetraext +belos +stratimikos +amesos +amesos2 +aztec
  #- swig
  view: true
  concretizer:
    unify: true
  toolchains:
    clang_gf:
    - spec: "%c=apple-clang"
      when: "%c"
    - spec: "%cxx=apple-clang"
      when: "%cxx"
    - spec: "%fortran=gcc"
      when: "%fortran"
  packages:
    all:
      require:
        - "%clang_gf"
      prefer:
        - ~mpi
        - cxxstd=17
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      
