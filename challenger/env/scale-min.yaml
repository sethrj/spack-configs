spack:
  specs:
  - ccache
  - cmake
  - git
  - git-lfs
  - googletest
  - hdf5
  - ninja
  - nlohmann-json
  - pugixml
  - python
  - py-furo
  - py-h5py
  - py-lxml
  - py-myst-parser
  - py-numpy
  - py-pint
  - py-sphinx
  #- py-sphinx-rtd-theme
  - py-sphinxcontrib-bibtex
  #- gnds
  - trilinos
  view: true
  concretizer:
    unify: true
  toolchains:
    clang_gf:
    - spec: "%c=apple-clang"
      when: "%c"
    - spec: "%cxx=apple-clang"
      when: "%cxx"
    - spec: "%fortran=gcc"
      when: "%fortran"
  packages:
    hdf5:
      require:
        - +hl
    trilinos:
      variants:
        - +shared ~mpi
      require:
        - >-
          @14.4:16 +kokkos
          +tpetra +ml +ifpack2 +belos +stratimikos +amesos2
          +epetra +ifpack +anasazi  +epetraext +amesos +aztec
          +intrepid 
    all:
      require:
        - "%clang_gf"
      prefer:
        - ~mpi
        - cxxstd=17
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      
