packages:
  apple-clang:
    externals:
    - spec: apple-clang@21.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@11.5.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-11
          cxx: /opt/homebrew/bin/g++-11
          fortran: /opt/homebrew/bin/gfortran-11
    - spec: gcc@16.1.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-16
          cxx: /opt/homebrew/bin/g++-16
          fortran: /opt/homebrew/bin/gfortran

  cmake:
    externals:
    - spec: cmake@4.4.2
      prefix: /opt/homebrew
