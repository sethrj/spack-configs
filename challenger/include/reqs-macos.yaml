#-----------------------------------------------------------------------------#
# This file is copied into the top-level directory of Celeritas during
# individual CI build jobs. It's then modified to add packages to the
# environment in `.github/actions/setup-spack/action.yml`.
#-----------------------------------------------------------------------------#

packages:
  all:
    prefer:
      - "cxxstd=20"
  covfie:
    variants:
      - generator=ninja
  hdf5:
    prefer: [~cxx] # override cxxstd preference
  geant4:
    variants:
      - generator=ninja
  g4vg:
    variants:
      - generator=ninja
  python:
    version:
      - "3.14" # spack installation July 2026
  root:
    variants:
      - generator=ninja
  vecgeom:
    variants:
      - generator=ninja
