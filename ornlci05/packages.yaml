packages:
  groff:
    externals:
    - spec: groff@1.19.2
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.1p1
      prefix: /usr
  # >>> install-spack.sh

  mcnp:
    buildable: false
    externals:
    - spec: mcnp@5.1.60
      prefix: /projects/MCNP5_v1.6/MCNP_CODE
  mcnp-data:
    buildable: false
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /projects/MCNP5_v1.6/MCNP_DATA

  scale-data:
    buildable: false
    externals:
    - spec: scale-data@master
      prefix: /Users/Shared/ornldev/code/scale-data

  hdf5:
    variants: +cxx +fortran +hl ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran +shared
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version: [2.10.0] # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  silo:
    variants: ~mpi
  swig:
    version: [4.0.2-fortran]
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    compiler:
    - apple-clang@13.0.0
    target: [x86_64]
    variants: cxxstd=11
  # <<< install-spack.sh
