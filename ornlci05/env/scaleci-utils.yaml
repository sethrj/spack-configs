spack:
  definitions:
  - platspecs: []
  - when: platform == "darwin"
    platspecs:
    - py-macholib
    - py-python-magic
  - when: platform != "darwin"
    platspecs:
    - valgrind
    - vim
    - zsh
  specs:
  - ccache
  - htop
  - libtree
  - llvm +clang ~flang
  - rename
  - $platspecs
  view: false
  concretization: together
  packages:
    valgrind:
      variants: ~boost~mpi
