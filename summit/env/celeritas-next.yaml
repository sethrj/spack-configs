spack:
  specs:
  - cmake %gcc@11.2.0
  - geant4@11.0 %gcc@11.2.0
  - googletest %gcc@11.2.0
  - hepmc3 %gcc@11.2.0
  - ninja %gcc@11.2.0
  - nlohmann-json %gcc@11.2.0
  - python %gcc@11.2.0
  - veccore %gcc@11.2.0
  - vecgeom +gdml ~shared %gcc@11.2.0
  view: /gpfs/alpine/proj-shared/csc404/celeritas-next/spack/view
  concretization: together
  packages:
    root:
      variants: ~davix ~examples ~opengl ~x ~tbb ~rootfit ~math ~gsl cxxstd=17
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
      variants: cxxstd=17 +cuda cuda_arch=70
      compiler: [gcc@11.2.0]
