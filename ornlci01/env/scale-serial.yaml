# This is a Spack Environment file for the new SCALE CI environment.
# It should also work on mac systems as well.
spack:
  # add package specs to the `specs` list
  specs:
  - bison@3.4.2
  - cmake
  - doxygen+graphviz
  - flex@2.6.4
  - gsl
  - hdf5 +cxx +fortran +hl ~mpi +szip api=v110
  - openblas
  - python +uuid
  - py-h5py ~mpi
  - py-h5sh
  - py-lxml
  - py-jsonschema
  - py-matplotlib
  - py-numpy
  - py-sphinx
  - qt@4.8:4.9 ~framework
  - silo +fortran ~mpi
  - swig@fortran
  view: true
  concretization: together
  packages:
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
      version: []
      target: []
      compiler: []
      buildable: true
