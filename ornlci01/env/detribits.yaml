# This is a Spack Environment file for Exnihilo.
spack:
  # add package specs to the `specs` list
  specs:
  - bison@3.4.2
  - 'cmake@3.16:'
  - flex@2.6.4
  - hdf5 ~cxx +hl +mpi +szip +fortran api=v110
  - 'ninja@1.10:'
  - openmpi
  - python +uuid
  - py-h5py
  - py-lxml
  - py-matplotlib
  - py-numpy
  - qt@4.8:4.9 ~framework
  - silo +mpi +fortran
  - swig@fortran
  - trilinos +amesos +anasazi +aztec +belos +ifpack +teuchos gotype=long_long +epetra
    +epetraext +kokkos +ifpack2 +intrepid +ml +sacado +shards +tpetra +stratimikos
    +hdf5 +mpi
  view: true
  concretization: together
  packages:
    py-h5py:
      variants: +mpi
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    trilinos:
      variants: ~adios2 ~alloptpkgs ~amesos2 ~boost ~cgns ~chaco ~complex ~debug ~dtk
        ~exodus +explicit_template_instantiation ~float +fortran ~fortrilinos ~glm   ~gtest
        +hdf5 ~hypre  ~intrepid2 ~isorropia ~matio ~mesquite ~metis ~minitensor ~muelu
        ~mumps ~netcdf ~nox ~openmp ~phalanx ~piro ~pnetcdf ~python ~rol ~rythmos
        +shared ~shylu ~stk ~suite-sparse ~superlu ~superlu-dist ~teko ~tempus ~x11
        ~xsdkflags ~zlib ~zoltan ~zoltan2
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      version: []
      target: []
      compiler: []
      buildable: true
