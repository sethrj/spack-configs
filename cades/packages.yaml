packages:
  advantg-data:
    permissions:
      read: group
      group: cades-nsed-advantg
    externals:
      - spec: "advantg-data@3"
        prefix: /software/user_tools/current/cades-nsed-advantg/data
    buildable: False
  advantg:
    permissions:
      read: group
      group: cades-nsed-advantg
    variants: ^scale/yqlxlai
  lava:
    permissions:
      read: group
      group: cades-nsed-scale
  mcnp-data:
    externals:
      - spec: "mcnp-data@5.1.60"
        prefix: /software/user_tools/current/cades-nsed-mcnp6/MCNP_DATA
      - spec: "mcnp-data@6.1.0"
        prefix: /software/user_tools/current/cades-nsed-mcnp6/MCNP_DATA
      - spec: "mcnp-data@iter"
        prefix: /software/user_tools/current/cades-nsed-exnihilo/iter-data
    buildable: False
  mcnp:
    externals:
      - spec: "mcnp@5.1.60"
        prefix: /software/user_tools/current/cades-nsed-mcnp6/MCNP_CODE/MCNP5
      - spec: "mcnp@6.1.0"
        prefix: /software/user_tools/current/cades-nsed-mcnp6/MCNP_CODE/MCNP6
    buildable: False
  scale:
    permissions:
      read: group
      group: cades-nsed-scale
  scale-data:
    permissions:
      read: group
      group: cades-nsed-scale
    externals:
      - spec: "scale-data@6.3b4"
        prefix: /software/user_tools/current/cades-nsed-exnihilo/scale-data/6.3b4
      - spec: "scale-data@6.2"
        prefix: /software/user_tools/current/cades-nsed-exnihilo/scale-data/6.2
    buildable: False
  openmpi:
    variants: +lustre +pmi schedulers=slurm fabrics=verbs
  lustre:
    externals:
      - spec: lustre@2.12.5
        prefix: /usr
  rdma-core:
    externals:
      - spec: rdma-core@17.1
        prefix: /usr
  slurm:
    externals:
      - spec: slurm@20.02.4
        prefix: /usr
  qt:
    variants: ~sql freetype=none ~ssl
  all:
    providers:
      mpi: [openmpi]
    target: [x86_64]
