packages:
  ninja:
    externals:
    - spec: ninja@1.10.2
      prefix: /usr/local
  git:
    externals:
    - spec: git@2.32.0~tcltk
      prefix: /usr/local
  git-lfs:
    externals:
    - spec: git-lfs@2.13.3
      prefix: /usr/local
  mcnp:
    externals:
    - spec: mcnp@5.1.60
      prefix: /rnsdhpc/opt/mcnp
  lmod:
    externals:
    - spec: lmod@8.5.7
      prefix: /usr/local/Cellar/lmod/8.5.7
  groff:
    externals:
    - spec: groff@1.19.2
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.1p1
      prefix: /usr
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version: [2.10.0] # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  scale:
    permissions:
      read: group
      group: scale6
  silo:
    variants: ~mpi
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    compiler:
    - gcc@8.3.0
    target: [x86_64]
    variants: cxxstd=11
