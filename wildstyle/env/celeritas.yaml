spack:
  specs:
  - cmake
  - cuda
  - geant4
  - git
  - git-lfs
  - googletest
  - hdf5 +hl +mpi
  - hepmc3
  - ninja
  - nlohmann-json
  - openmpi
  - python
  - py-h5py
  - root
  - valgrind ~ubsan
  - veccore
  - vecgeom +gdml
  view: true
  concretization: together
  packages:
    valgrind:
      variants: ~boost
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    root:
      variants: ~examples ~x ~opengl ~tbb ~rootfit ~python ~math ~gsl cxxstd=14
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    all:
      variants: +cuda cxxstd=14 cuda_arch=70
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      version: []
      target: []
      compiler: []
      buildable: true
