packages:
  llvm:
    externals:
    - spec: llvm@18.1.8+clang~flang~lld+lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  cuda:
    externals:
    - spec: cuda@12.9.41
      prefix: /usr/local/cuda-12.9
  scale-data:
    buildable: false
    externals:
    - spec: scale-data@local
      prefix: /data/scale/data
  all:
    variants: +cuda cuda_arch=70
