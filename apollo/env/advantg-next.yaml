spack:
  specs:
  - advantg@master +openmp
  - hdf5 +hl
  - mcnp@5.1.60
  - mcnp-data@5.1.60
  - openblas threads=none  # since it's used by trilinos and other stuff
  - python@2.7:2.8
  - scale +python +omnibus +mcnp +mpi ~data ~ampx ~dagmc ~fulcrum ~rte ~polaris +openmp
  - silo
  view: true
  concretization: together
  packages:
    lava:
      variants: +openmp
    pcre:
      variants: +jit
    python:
      variants: +libxml2 +shared +uuid
      version:
      - 2.7.16
    py-h5py:
      version:
      - 2.10.0
    py-matplotlib:
      version:
      - 2.2.3
    py-numpy:
      version:
      - 1.16.5
    py-pandas:
      version:
      - 0.24.2
    py-pillow:
      version:
      - 6.2.2
    py-pint:
      version:
      - 0.9
    py-scipy:
      version:
      - 1.2.2
    py-setuptools:
      version:
      - 44.1.0
    py-sphinx:
      version:
      - 1.8.4
    all:
      providers:
        blas:
        - openblas
        lapack:
        - openblas
        mpi:
        - openmpi
