# This is a Spack Environment file for core components
spack:
  # add package specs to the `specs` list
  specs:
  - gcc@5.4.0
  - git
  - git-lfs
  view: true
  concretization: together
  packages:
    all:
      compiler: [gcc@4.8.5]
      version: []
      target: []
      buildable: true
      modules: {}
      providers: {}
      paths: {}
