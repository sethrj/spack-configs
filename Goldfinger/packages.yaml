packages:
  coreutils:
    externals:
    - spec: coreutils@9.4
      prefix: /opt/homebrew/Cellar/coreutils/9.4
  openssh:
    externals:
    - spec: openssh@9.3p2
      prefix: /usr
  openssl:
    externals:
    - spec: openssl@3
      prefix: /opt/homebrew/opt/openssl@3
  autoconf:
    externals:
    - spec: autoconf@2.72
      prefix: /opt/homebrew/Cellar/autoconf/2.72
  automake:
    externals:
    - spec: automake@1.16.5
      prefix: /opt/homebrew/Cellar/automake/1.16.5
  bison:
    externals:
    - spec: bison@3.8.2
      prefix: /opt/homebrew/Cellar/bison/3.8.2
    - spec: bison@2.3
      prefix: /usr
  cmake:
    externals:
    - spec: cmake@3.30.2
      prefix: /opt/homebrew/Cellar/cmake/3.30.2
  curl:
    externals:
    - spec: curl@8.1.2+gssapi+ldap+nghttp2
      prefix: /usr
  doxygen:
    externals:
    - spec: doxygen@1.10.0~graphviz~mscgen
      prefix: /opt/homebrew/Cellar/doxygen/1.10.0
  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /usr
  git:
    externals:
    - spec: git@2.43.0~tcltk
      prefix: /opt/homebrew/Cellar/git/2.43.0
    - spec: git@2.39.3~tcltk
      prefix: /usr
  git-lfs:
    externals:
    - spec: git-lfs@3.4.1
      prefix: /opt/homebrew/Cellar/git-lfs/3.4.1
  gmake:
    externals:
    - spec: gmake@3.81
      prefix: /usr
  graphviz:
    externals:
    - spec: graphviz@10.0.1
      prefix: /opt/homebrew/Cellar/graphviz/10.0.1
  m4:
    externals:
    - spec: m4@1.4.19
      prefix: /opt/homebrew/Cellar/m4/1.4.19
  ninja:
    externals:
    - spec: ninja@1.11.1
      prefix: /opt/homebrew/Cellar/ninja/1.11.1
  # NOTE: do not include homebrew pkgconf
  all:
    providers:
      blas: [openblas]
      lapack: [openblas]
      mpi: [openmpi]
    variants: cxxstd=17 ~fortran
