spack:
  definitions:
  - platspecs: []
  - when: platform == "linux"
    platspecs:
    - valgrind
  specs:
  - cmake
  - doxygen
  - geant4@11.0.3 cxxstd=17 +vecgeom
  - git
  - git-lfs
  - googletest
  - hepmc3
  - ninja
  - nlohmann-json
  - python
  - py-breathe
  - py-sphinx
  - py-sphinx-rtd-theme
  - py-sphinxcontrib-bibtex
  - root cxxstd=17
  - swig
  - vecgeom +gdml cxxstd=17
  - $platspecs
  view: true
  concretizer:
    unify: true
  packages:
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
      variants: cxxstd=17
      # NOTE: add `+cuda cuda_arch=70` (or similar) to your site packages.py
