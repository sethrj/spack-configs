spack:
  specs:
  - adios2
  - cmake
  - doxygen
  - geant4@11.0 cxxstd=17
  - git
  - git-lfs
  - 'googletest@1.10:'
  - hepmc3
  - ninja
  - nlohmann-json
    # - mpi
  - 'python@3.6:'
  - py-breathe
  - py-furo
  - py-sphinx
  - py-sphinxcontrib-bibtex
  - py-sphinxcontrib-mermaid
  - 'root@6.24: cxxstd=17'
  - 'swig@4.1:'
  - 'vecgeom@1.2.4: +gdml cxxstd=17'
  view: true
  concretizer:
    unify: true
  packages:
    adios2:
      variants: ~blosc ~fortran ~png ~python ~ssc ~sst ~sz ~zfp
    mgard:
      variants: ~openmp
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      variants: cxxstd=17
      # NOTE: add `+cuda cuda_arch=70` (or similar) to your site packages.py
      # spack config add --scope=site packages:all:variants:"+cuda cuda_arch=70"
