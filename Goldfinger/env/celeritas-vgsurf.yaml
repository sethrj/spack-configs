spack:
  specs:
  - cmake
  - doxygen
  - "g4vg@1.0.3:"
  - geant4@11.0 cxxstd=17
  - git
  - git-lfs
  - 'googletest@1.10:'
  - hepmc3
  - ninja
  - nlohmann-json
  - mpi
  - 'python@3.6:'
  - py-breathe
  - py-furo
  - py-sphinx
  - py-sphinxcontrib-bibtex
  - py-sphinxcontrib-mermaid
  - 'root@6.24: cxxstd=17'
  - 'vecgeom@2.0.0-surfacedev.2:+surface+gdml cxxstd=17'
  view: true
  config:
    deprecated: true
  concretizer:
    unify: true
  packages:
    npm:
      externals:
      - spec: npm@10.8.3
        prefix: /opt/homebrew
    adios2:
      variants: ~blosc ~fortran ~png ~python ~ssc ~sst ~sz ~zfp
    mgard:
      variants: ~openmp
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      variants: cxxstd=17
      # NOTE: add `+cuda cuda_arch=70` (or similar) to your site packages.py
      # spack config add --scope=site packages:all:variants:"+cuda cuda_arch=70"
