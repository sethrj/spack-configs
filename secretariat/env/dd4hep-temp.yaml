#-----------------------------------------------------------------------------#
# This file is copied into the top-level directory of Celeritas during individual
# CI build jobs. It's then modified to add packages to the environment
# in `.github/actions/setup-spack/action.yml`.
#-----------------------------------------------------------------------------#

spack:
  include:
  - reqs-celer.yaml
  - reqs-ci.yaml
  - prefs-hep-nogui.yaml
  - ext-ubuntu24.yaml

  specs:
    # Base packages
  - cmake
  - ninja
  - ccache
  - cli11
  - googletest
  - hepmc3
  - libpng
  - nlohmann-json
  - covfie
    # Additional packages can be added with `spack add`
  - vecgeom@2.1.0
  - geant4@11.4
  - g4vg
  - root
  - dd4hep
  config:
    install_tree:
      root: /scratch/celeritas/opt
  view: /scratch/celeritas/view-temp
  packages:
    all:
      prefer: [cxxstd=20]
