spack:
  specs:
  - adios2
  - cli11
  - cmake
  - ninja
  - git-lfs
  - geant4@11.3
  - git-lfs
  - 'googletest@1.10:'
  - hepmc3
  - nlohmann-json
  - mpi
  - 'root@6.28:'
  view: /lustre/orion/world-shared/hep143/opt-view
  concretizer:
    unify: true
  config:
    install_tree:
      root: /lustre/orion/world-shared/hep143/opt
      projections:
        all: '{compiler.name}-{compiler.version}/{name}/{version}/{hash:4}'
  modules:
    default:
      roots:
        lmod: /lustre/orion/world-shared/hep143/share/lmod
      enable:
        - lmod
      lmod:
        all:
          autoload: direct
        hash_length: 0
        hide_implicits: False
        core_compilers: ["rocmcc@5.7.1"]
        projections:
          all: '{name}/{version}'
  packages:
    cmake:
      buildable: false
      externals:
        - spec: cmake@3.27.7~doc+ncurses+ownlibs
          prefix: /ccs/proj/hep143/opt/gcc-12.2.0/cmake/3.27.7/4kd5/
    git-lfs:
      buildable: false
      externals:
        - spec: git-lfs@3.3.0
          prefix: /ccs/proj/hep143/opt/gcc-12.2.0/git-lfs/3.3.0/wg6c/
    ninja:
      buildable: false
      externals:
        - spec: ninja@1.11.1+re2c
          prefix: /ccs/proj/hep143/opt/gcc-12.2.0/ninja/1.11.1/7s3b/
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb cxxstd=20
    all:
      variants: cxxstd=20 +rocm amdgpu_target=gfx90a
      compiler: [rocmcc@6.24]
