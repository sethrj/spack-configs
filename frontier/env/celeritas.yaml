spack:
  specs:
  - adios2
  - cmake
  - doxygen
  - geant4@11 cxxstd=17
  - git
  - git-lfs
  - 'googletest@1.10:'
  - hepmc3
  - ninja
  - nlohmann-json
  - mpi
  - 'python@3.6:'
  - 'root@6.24: cxxstd=17'
  - 'swig@4.1:'
