modules:
  prefix_inspections:
    '':
    - CMAKE_PREFIX_PATH
    - '${PACKAGE}_ROOT'
  default:
    enable::
      - lmod
    lmod:
      core_compilers:
        - 'clang@14.0.0-rocm5.1.0'
      hash_length: 4
      hierarchy:: []
      ^python:
        autoload:  'direct'
      geant4:
        autoload:  'direct'
      all:
        suffixes:
          '^python@2': py2
          '+cuda': 'cuda'
          '+debug': debug
          '+mpi': mpi
          '+multithreaded': mt
          '+openmp': mt
          '+threads': mt
          '~shared': 'static'
          'cxxstd=98': 'c++98'
          'cxxstd=11': 'c++11'
          'cxxstd=14': 'c++14'
