# This is a Spack Environment file for Exnihilo.
spack:
  # add package specs to the `specs` list
  specs:
  - cmake
  - doxygen+graphviz
  - hdf5 +fortran +hl +mpi
  - lava~openmp
  - mcnp@5.1.60
  - mcnp-data@5.1.60
  - openblas
  - openmpi
  - python +uuid
  - py-h5py +mpi
  - py-ipython
  - py-jupyter-console
  - py-lxml
  - py-matplotlib
  - py-numpy
  - py-pandas
  - py-pint
  - py-psutil
  - py-scipy
  - py-sphinx
  - py-tqdm
  - silo
  - swig@fortran
  view: true
  concretization: together
  packages:
    hdf5:
      variants: +szip
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    netcdf:
      variants: +mpi +parallel
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    silo:
      variants: +mpi
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    pcre:
      variants: +jit
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    python:
      variants: +libxml2
      version: []
      target: []
      compiler: []
      buildable: true
      providers: {}
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
      version: []
      target: []
      compiler: []
      buildable: true
