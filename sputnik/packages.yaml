packages:
  mcnp:
    externals:
    - spec: mcnp@5.1.60
      prefix: /rnsdhpc/opt/mcnp
  mcnp-data:
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /rnsdhpc/opt/mcnp/data
  groff:
    externals:
    - spec: groff@1.19.2
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.1p1
      prefix: /usr
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version: [2.10.0] # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  scale:
    permissions:
      read: group
      group: scale6
  silo:
    variants: ~mpi
  all:
    compiler: [apple-clang@12.0.0]
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    target: [x86_64]
    variants: cxxstd=11
