packages:
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl +szip ~mpi
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
  qt:
    variants: ~sql ~ssl ~tools
  scale:
    permissions:
      read: group
      group: scale6
  silo:
    variants: ~mpi
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    target: [x86_64]
    variants: cxxstd=11
  # <<< install-spack.sh
