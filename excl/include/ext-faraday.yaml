packages:
  c:
    buildable: false
  fortran:
    buildable: false
  cxx:
    buildable: false

  # ROCm components, found via:
  # $ spack external find --tag rocm --not-buildable -p /opt/rocm/core-7.14
  rocm-gdb:
    externals:
    - spec: rocm-gdb@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocprofiler-systems:
    externals:
    - spec: rocprofiler-systems@7.14
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocprofiler-compute:
    externals:
    - spec: rocprofiler-compute@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocminfo:
    externals:
    - spec: rocminfo@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  hipify-clang:
    externals:
    - spec: hipify-clang@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocjpeg:
    externals:
    - spec: rocjpeg@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocprofiler-register:
    externals:
    - spec: rocprofiler-register@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocdecode:
    externals:
    - spec: rocdecode@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocm-debug-agent:
    externals:
    - spec: rocm-debug-agent@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  composable-kernel:
    externals:
    - spec: composable-kernel@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocshmem:
    externals:
    - spec: rocshmem@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocm-core:
    externals:
    - spec: rocm-core@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocm-dbgapi:
    externals:
    - spec: rocm-dbgapi@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  rocprofiler-sdk:
    externals:
    - spec: rocprofiler-sdk@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false
  amdsmi:
    externals:
    - spec: amdsmi@7.14.0
      prefix: /opt/rocm/core-7.14
    buildable: false


  # ubuntu24.04
  bash:
    externals:
      - spec: bash@5.2.21
        prefix: /usr
  gcc:
    buildable: false
    externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13
