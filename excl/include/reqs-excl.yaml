config:
  concurrent_packages: 8
  locks: false
  build_jobs: 48
  source_cache: /auto/projects/celeritas/spack-cache/source
  install_tree:
    padded_length: 128
    projections:
      all: "{name}/{version}/{hash:7}"

mirrors:
  projects:
    url: /auto/projects/celeritas/spack-cache/build
    binary: true
    signed: false
    autopush: false

concretizer:
  unify: true
  targets:
    granularity: generic
    host_compatible: true

packages:
  all:
    target: [x86_64_v3]
    require:
      - target=x86_64_v3
    prefer:
      - "cxxstd=20" # can't require if cxxstd isn't an option
  hdf5:
    prefer:
      - ~cxx # override cxxstd preference
  # Compilers
  c:
    require: "gcc@13.3.0"
  cxx:
    require: "gcc@13.3.0"
