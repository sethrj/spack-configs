spack:
  specs:
    # Packages required for a *truly minimal* build
    - cli11
    - cmake
    - nlohmann-json
    # ... plus packages required for development
    - "geant4@11"
    - git
    - "googletest@1.10:"
    - "py-pre-commit ^py-identify@2.6:"
    - "python@3.9:"
    - ccache
    # ... plus *recommended* options
    - cuda@12
    - "covfie@0.13:"
    - "g4vg@1.0.3:"
    - hepmc3
    - libpng
    - ninja
    - "root@6.28:"
    - "vecgeom@1.2.10:1 +gdml"
    # ... plus optional dependencies
    - "dd4hep@1.33:"
    # ... plus utilities
    - libtree
  view: true
  concretizer:
    unify: true
  packages:
    root:
      # Note: dd4hep requires +gsl+math
      # ROOT here is built without GUI to reduce build time
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      require:
      - any_of: [cxxstd=20, '@:']
      - any_of: [build_system=cmake, '@:']
      - any_of: [build_type=Release, '@:']
      # Note: for CUDA support run this command in your environment:
      # spack config add packages:all:variants:"+cuda cuda_arch=<ARCH>"
      variants: "+cuda cuda_arch=90" # H100 on hudson
