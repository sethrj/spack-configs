spack:
  include:
    - excl.yaml
    - celeritas-packages.yaml
  specs:
    - cli11
    - ccache
    - cmake
    - nlohmann-json
    - geant4
    - git
    - googletest
    - py-pre-commit
    - python
    - covfie +cuda cuda_arch=70
    - g4vg
    - hepmc3
    - ninja
    - vecgeom +cuda cuda_arch=70
    - git-lfs
    - cuda@12.9
    - root
  packages:
    bash:
      buildable: false
      externals:
        - spec: bash@5.2.21
          prefix: /usr
    gcc:
      externals:
        - spec: gcc@13.3.0 languages:='c,c++,fortran'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc-13
              cxx: /usr/bin/g++-13
              fortran: /usr/bin/gfortran-13
    all:
      target: [x86_64_v3]
      require:
        - target=x86_64_v3
