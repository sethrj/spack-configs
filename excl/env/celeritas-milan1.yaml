spack:
  include:
  - celeritas-packages.yaml
  specs:
  - cli11
  - cmake
  - nlohmann-json
  - geant4
  - git
  - googletest
  - py-pre-commit
  - python
  - covfie ~cuda
  - g4vg
  - hepmc3
  - ninja
  - vecgeom ~cuda
  - git-lfs
  config:
    install_tree:
      root: $spack/opt
      projections:
        all: "{name}/{version}/{hash:7}"
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      externals:
      - spec: gcc@12.4.0 languages:='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-12
            cxx: /usr/bin/g++-12
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    all:
      target: [x86_64_v3]
      require:
      - '%gcc'
      - target=x86_64_v3
