spack:
  include:
  - celeritas-packages.yaml
  specs:
  - cli11
  - cmake
  - nlohmann-json
  - geant4
  - git
  - googletest
  - py-pre-commit
  - python
  - covfie +cuda cuda_arch=70
  - g4vg
  - hepmc3
  - ninja
  - vecgeom +cuda cuda_arch=70
  - git-lfs
    # Additional
  - gh
  - cuda@12.9
  config:
    install_tree:
      root: /auto/projects/celeritas/opt
      padded_length: 128
      projections:
        all: "{name}/{version}/{hash:7}"
  view: true
  concretizer:
    unify: true
  toolchains:
    gcc13:
    - spec: "%c=gcc@13"
      when: "%c"
    - spec: "%cxx=gcc@13"
      when: "%cxx"
    - spec: "%fortran=gcc@13"
      when: "%fortran"
  packages:
    gcc:
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13
    all:
      target: [x86_64_v3]
      require:
      - '%gcc13'
      - target=x86_64_v3
