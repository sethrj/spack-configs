spack:
  # NOTE: earlier includes have higher precedence
  include:
  - secretariat.yaml
  - excl.yaml
  - celeritas-packages.yaml
  view: false
  concretizer:
    unify: false
  config:
    deprecated: true

  mirrors:
    sethrj:
      url: oci://ghcr.io/sethrj/spack-buildcache
      binary: true
      signed: false
      autopush: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN

  definitions:
  - compilers:
    - llvm_gfortran
  - core:
    - ccache
    - cmake
    - ninja
    - git
    - python
    - py-gcovr

  - cxx17:
    - 'googletest cxxstd=17'
    - 'vecgeom@1.2 cxxstd=17'
    - 'geant4@10.5 cxxstd=17'
    - 'geant4@10.6 cxxstd=17'
    - 'g4vg ^vecgeom@1.2 cxxstd=17'

  - cxx20:
    - cli11
    - covfie
    - hepmc3
    - nlohmann-json
    - 'vecgeom@1.2'
    - 'vecgeom@2.0.0-rc.7'
    - root
    - 'geant4@10.7' 
    - 'geant4@11.0'
    - 'geant4@11.1'
    - 'geant4@11.2'
    - 'geant4@11.3'
    - 'geant4@11.4'
    - 'g4vg ^vecgeom@1.2 cxxstd=20'

  specs:
  - matrix:
    - [$%compilers]
    - [$core, $cxx17, $cxx20]

  packages:
    all:
      prefer:
        ["cxxstd=20"]
