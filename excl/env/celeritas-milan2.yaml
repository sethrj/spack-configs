spack:
  specs:
    # Packages required for a *truly minimal* build
    - cli11
    - cmake
    - nlohmann-json
    # ... plus packages required for development
    - "geant4@11"
    - git
    - "googletest@1.10:"
    - "py-pre-commit ^py-identify@2.6:"
    - "python@3.9:"
    - ccache
    # ... plus *recommended* options
    - cuda@12
    - "covfie@0.13:"
    - "g4vg@1.0.3:"
    - hepmc3
    - libpng
    - ninja
    - "root@6.28:"
    - "vecgeom@1.2.10:1 +gdml"
    # ... plus utilities
    - libtree
    - gh
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      buildable: False
      externals:
      - spec: gcc@11.4.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    root:
      # Note: dd4hep requires +gsl+math
      # ROOT here is built without GUI to reduce build time
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      require:
      - '%gcc'
      - any_of: [cxxstd=20, '@:']
      - any_of: [build_system=cmake, build_system=make, '@:']
      - any_of: [build_type=Release, '@:']
      - any_of: ["+cuda cuda_arch=70", '@:']
