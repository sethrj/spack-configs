spack:
  specs:
    # Packages required for a *truly minimal* build
  - cli11
  - cmake
  - nlohmann-json
    # ... plus packages required for development
  - geant4@11
  - git
  - 'googletest@1.10:'
  - 'py-pre-commit ^py-identify@2.6:'
  - 'python@3.9:'
  - ccache
    # ... plus *recommended* options
  - 'covfie@0.13:'
  - hepmc3
  - libpng
  - ninja
  - 'root@6.28:'
    # ... plus utilities
  - libtree
  view: true
  concretizer:
    unify: true
  config:
    #install_tree:
    #  root: '/auto/projects/celeritas/opt'
    #  projections:
    #    all: '{architecture.os}/{compiler.name}-{compiler.version}/{name}/{version}/{hash:7}'
    toolchains:
      llvm:
      - spec: '%c=llvm'
        when: '%c'
      - spec: '%cxx=llvm'
        when: '%cxx'
      - spec: '%fortran=llvm'
        when: '%fortran'
  packages:
    hip:
      externals:
      - spec: hip@3.19.21
        prefix: /usr
      - spec: hip@7.0.1
        prefix: /opt/rocm-7.0.1
    llvm:
      externals:
      - spec: llvm@20.0.0+clang+flang~lld~lldb
        prefix: /opt/rocm-7.0.1/lib/llvm
        extra_attributes:
          compilers:
            c: /opt/rocm-7.0.1/lib/llvm/bin/clang
            cxx: /opt/rocm-7.0.1/lib/llvm/bin/clang++
            fortran: /opt/rocm-7.0.1/lib/llvm/bin/flang
    llvm-amdgpu:
      buildable: false
      externals:
      - spec: llvm-amdgpu@7.0.1
        prefix: /opt/rocm-7.0.1
        extra_attributes:
          compilers:
            c: /opt/rocm-7.0.1/lib/llvm/bin/amdclang
            cxx: /opt/rocm-7.0.1/lib/llvm/bin/amdclang++
            fortran: /opt/rocm-7.0.1/lib/llvm/bin/amdflang
    root:
      # Note: dd4hep requires +gsl+math
      # ROOT here is built without GUI to reduce build time
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      require:
      - '%llvmcxx'
      - any_of: [cxxstd=20, '@:']
      - any_of: [build_system=cmake, '@:']
      - any_of: [build_type=Release, '@:']
      - any_of: [+rocm amdgpu_target=gfx942, '@:']
      - any_of: [~cuda, '@:']
