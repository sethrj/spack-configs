packages:
  bash:
    externals:
      - spec: bash@5.1.16
        prefix: /usr
  python:
    externals:
      - spec: python@3.10.12+bz2+crypt+ctypes+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
        prefix: /usr
  gcc:
    buildable: false
    externals:
      - spec: gcc@12.3.0 languages:='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-12
            cxx: /usr/bin/g++-12

toolchains:
  gcc12:
    - spec: "%c=gcc@12"
      when: "%c"
    - spec: "%cxx=gcc@12"
      when: "%cxx"
    - spec: "%fortran=gcc@12"
      when: "%fortran"
