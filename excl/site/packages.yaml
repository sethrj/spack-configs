packages:
  gcc:
    externals:
    - spec: gcc@9.5.0 languages:=c
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-9
    - spec: gcc@11.5.0 languages:=c
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-11
    - spec: gcc@12.4.0 languages:='c,c++'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
    - spec: gcc@13.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  llvm:
    externals:
    - spec: llvm@14.0.6+clang~flang~lld~lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang-14
          cxx: /usr/bin/clang++-14
    - spec: llvm@17.0.6+clang~flang~lld~lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang-17
          cxx: /usr/bin/clang++-17
    - spec: llvm@18.1.3+clang~flang~lld~lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
