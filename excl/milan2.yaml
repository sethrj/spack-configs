packages:
  bash:
    buildable: false
    externals:
      - spec: bash@5.2.21
        prefix: /usr
  gcc:
    externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13