packages:
  bash:
    externals:
      - spec: bash@5.2.21
        prefix: /usr
  gcc:
    buildable: false
    externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13

toolchains:
  gcc13:
    - spec: "%c=gcc@13"
      when: "%c"
    - spec: "%cxx=gcc@13"
      when: "%cxx"
    - spec: "%fortran=gcc@13"
      when: "%fortran"