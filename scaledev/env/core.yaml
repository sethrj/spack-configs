spack:
  specs:
  - gcc@8.5.0
  - git
  - git-lfs
  - lmod
  - python
  view: true
  concretization: together
  packages:
    lua:
      variants: +shared
    perl:
      variants: +shared
    python:
      variants: +shared +uuid
    all:
      compiler: [gcc@4.8.5]
      variants: ~shared+pic libs=static
