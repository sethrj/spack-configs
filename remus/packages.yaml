packages:
  advantg:
    permissions:
      read: group
      group: advantg
  advantg-data:
    permissions:
      read: group
      group: advantg
    paths:
      advantg-data@3: /projects/advantg/data
    buildable: False
  geant4:
    variants: cxxstd=11 ~threads ~data
  geant4-data:
    paths:
      geant4-data@10.04: /projects/exnihilo/geant4-data
      buildable: False
  hdf5:
    variants: ~mpi
  lava:
    permissions:
      read: group
      group: scale6
  mcnp:
    paths:
      mcnp@5.1.60: /projects/MCNP5_v1.6/MCNP_CODE
      mcnp@6.1.0: /projects/MCNP_V61/MCNP_CODE
      mcnp@6.1.1: /projects/MCNP_V611/MCNP_CODE
    buildable: False
  mcnp-data:
    paths:
      mcnp-data@5.1.60: /projects/MCNP5_v1.6/MCNP_DATA
      mcnp-data@6.1.0: /projects/MCNP_V61/MCNP_DATA
      mcnp-data@6.1.1: /projects/MCNP_V611/MCNP_DATA
      mcnp-data@iter: /projects/exnihilo/iter-data
    buildable: False
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran
  openmpi:
    variants: schedulers=tm
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
  python:
    variants: +shared +uuid
  qt:
    variants: ~sql freetype=none ~ssl
  silo:
    variants: ~mpi
  scale:
    permissions:
      read: group
      group: scale6
  scale-data:
    paths:
      scale-data@6.3.0-A3: /scale/data/cache/v6.3.0-A3
      scale-data@6.2.0: /scale/data/cache/v6.2.0
    buildable: False
  all:
    providers:
      mpi: [openmpi]
    target: [x86_64]
