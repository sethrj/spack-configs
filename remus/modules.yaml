modules:
  enable::
    - lmod
  lmod:
    hierarchy:: []
    blacklist_implicits: true
    core_compilers:
      - 'gcc@4.4.7'
    hash_length: 0
    ^python:
      autoload:  'direct'
    all:
      suffixes:
        '+cuda': 'cuda'
        '+debug': 'debug'
        '+mpi': 'mpi'
        '+multithreaded': 'mt'
        '+openmp': 'mt'
        '~shared': 'static'
        '^zlib~shared': 'static'
        '+threads': 'mt'
        '^python@2': 'py2'
        'cxxstd=98': 'c++98'
        'cxxstd=14': 'c++14'
        'cxxstd=17': 'c++17'
      environment:
        set:
          '${PACKAGE}_ROOT': '${PREFIX}'
        prepend_path:
          'LD_RUN_PATH': '${PREFIX}/lib'
      filter:
        environment_blacklist: ['CPATH', 'LIBRARY_PATH', 'LD_LIBRARY_PATH']
    libffi: &lib64
      environment:
        prepend_path:
          'LD_RUN_PATH': '${PREFIX}/lib64'
    geant4: *lib64
    jpeg-turbo: *lib64
    lava: &lrestricted
      template: 'group-restricted.lua'
    mcnp: &lrestricted-runtime
      <<: *lrestricted
      filter:
        environment_blacklist: ['CPATH', 'LIBRARY_PATH', 'LD_LIBRARY_PATH',
          'LD_RUN_PATH']
    mcnp-data: *lrestricted-runtime
    scale: *lrestricted-runtime
    scale-data: *lrestricted-runtime
