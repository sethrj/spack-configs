modules:
  enable::
    - lmod
  prefix_inspections:
    bin:
    - PATH
    man:
    - MANPATH
    share/man:
    - MANPATH
    share/aclocal:
    - ACLOCAL_PATH
    include:: []
    lib:
    - LIBRARY_PATH
    lib64:
    - LIBRARY_PATH
    lib/pkgconfig:
    - PKG_CONFIG_PATH
    lib64/pkgconfig:
    - PKG_CONFIG_PATH
    share/pkgconfig:
    - PKG_CONFIG_PATH
  lmod:
    core_compilers:
      - 'apple-clang@12.0.0'
    hash_length: 4
    hierarchy:: []
    ^python:
      autoload:  'direct'
    all:
      suffixes:
        '^python@2': py2
        '+cuda': 'cuda'
        '+debug': debug
        '+mpi': mpi
        '+multithreaded': mt
        '+openmp': mt
        '+threads': mt
        '~shared': 'static'
        'cxxstd=98': 'c++98'
        'cxxstd=14': 'c++14'
        'cxxstd=17': 'c++17'
      environment:
        set:
          '${PACKAGE}_ROOT': '${PREFIX}'
