modules:
  prefix_inspections:
    '':
    - CMAKE_PREFIX_PATH
    - '${PACKAGE}_ROOT'
  default:
    enable::
      - lmod
    lmod:
      core_compilers:
        - 'apple-clang@12.0.5'
      hash_length: 4
      hierarchy:: []
      ^python:
        autoload:  'direct'
      all:
        suffixes:
          '^python@2': py2
          '+debug': debug
          '+mpi': mpi
          '+multithreaded': mt
          '+threads': mt
          '+openmp': mt
          'cxxstd=98': 'c++98'
          'cxxstd=14': 'c++14'
          'cxxstd=17': 'c++17'
