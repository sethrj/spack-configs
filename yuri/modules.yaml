modules:
  prefix_inspections:
    '':
    - CMAKE_PREFIX_PATH
    - '${PACKAGE}_ROOT'
  default:
    enable::
      - lmod
    lmod:
      core_compilers:
        - 'apple-clang@13.0.0'
      hierarchy:: []
      hash_length: 0
      ^python:
        autoload:  'direct'
      projections:
        all: "{name}/{version}.{hash:4}"
        ^python@2: "py2/{name}/{version}.{hash:4}"
      all:
        suffixes:
          '^python@2': py2
          '+debug': debug
          '+mpi': mpi
          '+multithreaded': mt
          '+threads': mt
          '+openmp': mt
          'api=v110': 'api110'
          'api=v112': 'api112'
          'cxxstd=98': 'c++98'
          'cxxstd=14': 'c++14'
          'cxxstd=17': 'c++17'
