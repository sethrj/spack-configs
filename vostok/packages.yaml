packages:
  opengl:
    externals:
    - spec: opengl@2.1
      prefix: /opt/X11
  autoconf:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/autoconf/2.71, spec: autoconf@2.71}
  automake:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/automake/1.16.3_1, spec: automake@1.16.3_1}
  bash:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/bash/5.1.8, spec: bash@5.1.8}
  cmake:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/cmake/3.20.2, spec: cmake@3.20.2}
  coreutils:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/coreutils/8.32, spec: coreutils@8.32}
  gcc:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/gcc/11.1.0_1, spec: gcc@11.1.0_1}
  git:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/git/2.31.1, spec: git@2.31.1}
  git-lfs:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/git-lfs/2.13.3, spec: git-lfs@2.13.3}
  hdf5: {variants: +cxx +fortran +hl +szip ~mpi}
  htop:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/htop/3.0.5, spec: htop@3.0.5}
  lmod:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/lmod/8.5.2, spec: lmod@8.5.2}
  lua:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/lua/5.4.3, spec: lua@5.4.3}
  m4:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/m4/1.4.18, spec: m4@1.4.18}
  mcnp:
    buildable: false
    externals:
    - {prefix: /Users/s3j/LANL/MCNP5, spec: mcnp@5.1.60}
  mcnp-data:
    buildable: false
    externals:
    - {prefix: /Users/s3j/LANL/MCNP_DATA, spec: mcnp-data@5.1.60}
  doxygen: {variants: +graphviz}
  moab: {variants: ~mpi ~parmetis ~coupler ~metis ~fortran}
  netcdf: {variants: ~mpi ~parallel}
  ninja:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/ninja/1.10.2, spec: ninja@1.10.2}
  node-js:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/node/16.2.0, spec: node-js@16.2.0}
  pcre: {variants: +jit}
  perl:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/perl/5.34.0, spec: perl@5.34.0}
  pkgconf:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/pkg-config/0.29.2_3, spec: pkgconf@0.29.2_3}
  py-h5py:
    variants: ~mpi
    version: [2.10.0]
  qt: {variants: ~sql ~ssl ~tools}
  rename:
    buildable: false
    externals:
    - {prefix: /usr/local/Cellar/rename/1.601, spec: rename@1.601}
  scale:
    permissions: {group: scale6, read: group}
  scale-data:
    buildable: false
    externals:
    - {prefix: /rnsdhpc/share/scale/data, spec: scale-data@dev}
  silo: {variants: ~mpi}
  advantg-data:
    buildable: false
    externals:
    - {prefix: /usr/local/advantg-data, spec: advantg-data@dev}
  all:
    providers:
      blas: [openblas]
      lapack: [openblas]
      mpi: [openmpi]
    target: [x86_64]
    variants: cxxstd=11
