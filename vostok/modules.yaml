modules:
  enable::
    - lmod
  lmod:
    core_compilers:
      - 'apple-clang@11.0.0'
    hash_length: 0
    hierarchy:: []
    ^python:
      autoload:  'direct'
    all:
      suffixes:
        '^python@2': py2
        '+debug': debug
        '+mpi': mpi
        '+multithreaded': mt
        '+threads': mt
        '+openmp': mt
        'cxxstd=98': 'c++98'
        'cxxstd=14': 'c++14'
        'cxxstd=17': 'c++17'
      filter:
        environment_blacklist: ['CPATH', 'C_INCLUDE_PATH', 'CPLUS_INCLUDE_PATH', 'INCLUDE', 'LIBRARY_PATH', 'DYLD_LIBRARY_PATH']
      environment:
        set:
          '${PACKAGE}_ROOT': '${PREFIX}'
