# This is a Spack Environment file for the new SCALE CI environment.
# It should also work on mac systems as well.
spack:
  # add package specs to the `specs` list
  specs:
  - bison@3.4.2
  - cmake
  - doxygen+graphviz
  - flex@2.6.4
  - gsl

  - hdf5 +fortran +hl ~mpi api=v110
  - 'java@14:'
  - nlohmann-json
  - openblas
  - openmpi@:2.999
  - python +uuid
  - py-h5py ~mpi @:2.999 # bug in 3,3.1
  - py-h5sh
  - py-lxml
  - py-jsonschema
  - py-matplotlib
  - py-numpy
  - py-pandas
  - py-pint
  - py-psutil
  - py-sphinx
  - py-pyyaml
  - qt@5:5.99 +gui
  - silo +fortran ~mpi
  - swig@4.0.2-fortran

  view: true
  concretization: together
  packages:
    hwloc:
      version: [1.11.13] # needed for openmpi 2
    qt:
      variants: ~dbus~examples~gtk~opengl~phonon+shared~sql~ssl~tools~webkit
      version: [5.9.9]
    all:
      providers:
        blas: [openblas]
        lapack: [openblas]
        mpi: [openmpi]
