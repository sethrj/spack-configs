modules:
  prefix_inspections:
    '':
    - CMAKE_PREFIX_PATH
    - '${PACKAGE}_ROOT'
  default:
    enable::
      - lmod
    lmod:
      core_compilers:
        - 'gcc@4.8.5'
      hash_length: 4
      hierarchy:: []
      ^py-setuptools:
        autoload:  direct
      all:
        autoload:  none
        suffixes:
          '^python@2': py2
          '+cuda': cuda
          '+debug': debug
          '+mpi': mpi
          '+multithreaded': mt
          '+openmp': mt
          '+threads': mt
          '~shared': static
          'cxxstd=98': 'c++98'
          'cxxstd=14': 'c++14'
          'cxxstd=17': 'c++17'
      advantg: &restricted
        template: 'group-restricted.lua'
      advantg-data: *restricted
      lava: *restricted
      mcnp: *restricted
      mcnp-data: *restricted
      scale: *restricted
      scale-data: *restricted
