spack:
  specs:
    - group: tools
      specs:
        #- gcc
        - cmake
    - group: compilers
      needs: [tools]
      specs:
        - llvm@19
    - group: libs
      needs: [compilers]
      specs:
        - googletest
      override:
        packages:
          all:
            target: [x86_64_v3]
            require:
              - target=x86_64_v3
              - "%llvm@19"

  packages:
    gcc:
      buildable: false
      externals:
        - spec: gcc@12.3.0 languages:='c,c++'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc-12
              cxx: /usr/bin/g++-12
    all:
      target: [x86_64_v3]
      require:
        - target=x86_64_v3


