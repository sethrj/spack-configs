packages:
  gcc:
    externals:
    - spec: gcc@11.2.0 languages=c,c++,fortran
      prefix: /opt/homebrew/Cellar/gcc/11.2.0_3
      extra_attributes:
        compilers:
          c: /opt/homebrew/Cellar/gcc/11.2.0_3/bin/gcc-11
          cxx: /opt/homebrew/Cellar/gcc/11.2.0_3/bin/g++-11
          fortran: /opt/homebrew/Cellar/gcc/11.2.0_3/bin/gfortran-11
  go:
    externals:
    - spec: go@1.17.6
      prefix: /opt/homebrew
  groff:
    externals:
    - spec: groff@1.19.2
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.1p1
      prefix: /usr
  # >>> install-spack.sh
  hdf5:
    variants: +cxx +fortran +hl ~mpi
  mcnp:
    buildable: false
    externals:
    - spec: mcnp@5.1.60
      prefix: /opt/mcnp5/1.6/MCNP_CODE
  mcnp-data:
    buildable: false
    externals:
    - spec: mcnp-data@5.1.60
      prefix: /opt/mcnp5/1.6/MCNP_DATA
  moab:
    variants: ~mpi ~parmetis ~coupler ~metis ~fortran +shared
  netcdf:
    variants: ~mpi ~parallel
  pcre:
    variants: +jit
  py-h5py:
    variants: ~mpi
    version: [2.10.0] # 3.0 and 3.1 fail with variable length arrays
  qt:
    variants: ~sql ~ssl ~tools
  scale:
    permissions:
      read: group
      group: scale6
  silo:
    variants: ~mpi
  swig:
    version: [4.0.2-fortran]
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
    variants: cxxstd=11
